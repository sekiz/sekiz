name: Generate Snake Animation

permissions:
  contents: write

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sekiz
          outputs: |
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#6366f1&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Commit and push snake animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake-dark.svg
          git commit -m "chore(snake): auto-generate contribution snake animation" || exit 0
          git push origin main
