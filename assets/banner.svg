<svg width="900" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="900" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="50%" stop-color="#0c0e17"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>

    <!-- Radial Accent Glows -->
    <radialGradient id="ambientGlow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientGlow2" cx="85%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Linear Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="900" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Pattern Grid -->
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.3; }
    }
    .pulse-dot {
      animation: pulse 3s ease-in-out infinite;
    }
  </style>

  <!-- Card Base -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)"/>
  <rect width="900" height="240" rx="16" fill="url(#ambientGlow1)"/>
  <rect width="900" height="240" rx="16" fill="url(#ambientGlow2)"/>
  <rect width="900" height="240" rx="16" fill="url(#dotGrid)"/>
  <rect x="0.5" y="0.5" width="899" height="239" rx="15.5" stroke="url(#borderGrad)"/>

  <!-- Top Metadata Bar -->
  <g transform="translate(48, 42)">
    <!-- Pill Indicator -->
    <rect width="210" height="24" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="12" cy="12" r="3.5" fill="#10b981" class="pulse-dot"/>
    <text x="24" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="11" font-weight="500" letter-spacing="0.8">AI-NATIVE PRODUCT DESIGN</text>

    <!-- Latency / Mode Coordinates -->
    <text x="750" y="16" fill="#475569" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" letter-spacing="1">LATENCY · DETERMINISM · CRAFT</text>
  </g>

  <!-- Name / Title -->
  <g transform="translate(48, 114)">
    <text fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="34" font-weight="700" letter-spacing="-0.8">Sinan Asil</text>
    <text x="175" y="-2" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="20" font-weight="400">/ sekiz</text>
  </g>

  <!-- Role Subtitle -->
  <g transform="translate(48, 150)">
    <text fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="15" font-weight="500" letter-spacing="-0.2">
      Sr. Product Designer &amp; Design Engineer · Generative UIs, Multi-Agent Systems &amp; High-Craft Interfaces
    </text>
  </g>

  <!-- Bottom Accent / Design Tokens -->
  <g transform="translate(48, 192)">
    <line x1="0" y1="0" x2="804" y2="0" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="0" y="18" fill="#64748b" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" letter-spacing="0.5">
      FIGMA ── REACT ── TYPESCRIPT ── AGENTIC WORKFLOWS ── GENERATIVE TOKENS
    </text>
    <text x="735" y="18" fill="#6366f1" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" font-weight="600" letter-spacing="0.5">
      v2026.1
    </text>
  </g>
</svg>
